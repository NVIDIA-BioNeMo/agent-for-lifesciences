[pytest]
# backend/api has no __init__.py, so `from api.x import y` only resolves if
# backend/ is on sys.path. `python -m pytest` happened to supply that via the
# cwd when run from backend/; this makes the bare `pytest` command work, from
# any directory. evals/ is on the path for the same reason, so the eval harness
# imports as `aevom_eval.*` both here and inside the Harbor container.
pythonpath =
    backend
    evals

# The suites that run natively in the devcontainer (see `make test-fast`). The
# vina, pyexec and training suites need their container images and are run by
# `make test` -- pass their paths explicitly to override this.
testpaths =
    backend/api/tests
    backend/api/tools/tests
    backend/api/training/tests
    evals/tests

asyncio_default_fixture_loop_scope = function
