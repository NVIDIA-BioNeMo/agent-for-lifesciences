# GPU override for Vina GPU acceleration
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Or:    make up-gpu / make dev-gpu
#
# Prerequisites:
#   - NVIDIA GPU with CUDA support
#   - NVIDIA driver 560+ on x86_64 (CUDA 12.6), 575+ on arm64 (CUDA 12.9)
#   - nvidia-container-toolkit installed
#   - Run 'make check' to verify GPU support

services:
  vina:
    build:
      context: ./services/vina
      dockerfile: Dockerfile
      target: gpu-final  # Build GPU-accelerated Vina
    image: aevom-vina-gpu:latest
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VINA_GPU=true
      - CONFORMER_COUNT=${CONFORMER_COUNT:-50}
      - ROT_BOND_THRESHOLD=${ROT_BOND_THRESHOLD:-15}
      - UNIDOCK_SEARCH_MODE=${UNIDOCK_SEARCH_MODE:-balance}
      # Out-of-process nvMolKit conformer worker (see services/vina/conformer_worker)
      - CONFORMER_WORKER_PYTHON=${CONFORMER_WORKER_PYTHON:-/opt/aevom-conformer-worker/bin/python}
      - CONFORMER_WORKER_STARTUP_TIMEOUT_S=${CONFORMER_WORKER_STARTUP_TIMEOUT_S:-120}
      - CONFORMER_WORKER_REQUEST_TIMEOUT_S=${CONFORMER_WORKER_REQUEST_TIMEOUT_S:-300}
      - CONFORMER_WORKER_MAX_PAYLOAD_BYTES=${CONFORMER_WORKER_MAX_PAYLOAD_BYTES:-67108864}
      - CONFORMER_WORKER_RESTART_BACKOFF_S=${CONFORMER_WORKER_RESTART_BACKOFF_S:-60}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
