# Docker Compose override for debugging Vina memory issues
# Usage: docker compose -f docker-compose.dev.yml -f docker-compose.debug.yml up vina -d
#
# Note: When running from devcontainer, use HOST_PROJECT_PATH for volume mounts.
# Example: HOST_PROJECT_PATH=/home/abe/projects/aevom docker compose ...

services:
  vina:
    volumes:
      # Mount the app code for live instrumentation (use host path)
      - ${HOST_PROJECT_PATH:-/home/abe/projects/aevom}/services/vina/app:/app/app:ro
      # Mount the debug log directory so container can write to host
      - ${HOST_PROJECT_PATH:-/home/abe/projects/aevom}/.cursor:/app/debug_logs
    environment:
      - LOG_LEVEL=DEBUG
      - DEBUG_LOG_PATH=/app/debug_logs/debug.log
