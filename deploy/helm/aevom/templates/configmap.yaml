{{/*
`config` is rendered verbatim. Every value is quoted because ConfigMap data must
be strings, and an unquoted `"false"` or a bare port number would fail the API
server's validation.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: aevom-config
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "aevom") | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
