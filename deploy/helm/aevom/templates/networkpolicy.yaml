{{/*
In openshell mode, sandbox pods run model-written code in another namespace.
OpenShell's own policy already limits their egress to aevom-api; this is the
cluster-level backstop if that layer fails. Every workload except aevom-api
admits traffic only from pods in this namespace, so the one thing reachable
from outside it -- a sandbox included -- is the api, which the ingress needs
anyway.

aevom-api is deliberately not selected: a policy on it would also have to name
the ingress controller's namespace, which varies by cluster.
*/}}
{{- if and (eq .Values.pyexec.mode "openshell") .Values.openshell.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aevom-namespace-only
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "aevom-namespace-only") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: ["aevom-api"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
{{- end }}
