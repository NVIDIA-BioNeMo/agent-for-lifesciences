{{/*
Only created when a prompt override is supplied. The image carries prompts.md, so
absent this ConfigMap the api still starts -- which is the point: an external user
needs no extra step, while the internal deploy can ship a prompt change without
rebuilding by passing `--set-file prompts.content=prompts.md`.
*/}}
{{- if .Values.prompts.content }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: aevom-prompts
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "aevom") | nindent 4 }}
data:
  # Quoted rather than a block scalar so the prompt is stored byte-for-byte. A
  # `|-` block would silently drop the file's trailing newline, and any line that
  # happened to start with a tab would break the render.
  prompts.md: {{ .Values.prompts.content | quote }}
{{- end }}
