{{- if and .Values.pyexec.enabled (eq .Values.pyexec.mode "direct") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyexec
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "pyexec") | nindent 4 }}
spec:
  {{- if not .Values.pyexec.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app: pyexec
  template:
    metadata:
      labels:
        app: pyexec
    spec:
      # Runs model-written code, so it gets no API token, no root, no writable
      # image and no capabilities. /tmp is the only path it writes.
      automountServiceAccountToken: false
      {{- if not .Values.pyexec.hostUsers }}
      hostUsers: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pyexec
          image: {{ include "aevom.image" (dict "root" $ "component" "pyexec") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: aevom-config
                  key: LOG_LEVEL
            - name: HOME
              value: /tmp
            - name: MPLCONFIGDIR
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            {{- range $key, $value := .Values.pyexecEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.pyexec.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pyexec
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "pyexec") | nindent 4 }}
spec:
  selector:
    app: pyexec
  ports:
    - port: 8000
      targetPort: 8000
{{- end }}
