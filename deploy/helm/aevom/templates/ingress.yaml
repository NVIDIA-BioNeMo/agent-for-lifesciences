{{- if .Values.ingress.enabled }}
{{/*
Name kept as aevom-ingress, matching what kustomize created, so the live object
is adopted rather than duplicated.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aevom-ingress
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "aevom-api") | nindent 4 }}
  annotations:
    {{- /* Quoted individually: annotation values must be strings, and a numeric
           override (proxy-read-timeout: 60) would otherwise render as an int and
           be rejected by the API server. */}}
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: aevom-api
                port:
                  number: {{ .Values.api.service.port }}
{{- end }}
