{{- if .Values.redis.enabled }}
{{/*
Redis backs the job manager and the training event broadcaster. Persistence is on
(appendonly) so an in-flight job survives a restart.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
{{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.redis.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    # Recreate: ReadWriteOnce volume, same reasoning as postgres.
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
