{{- if .Values.api.enabled }}
{{/*
Named aevom-api because that name is load-bearing: config.SANDBOX_BACKEND_URL and
pyexecEnv.BACKEND_URL resolve it, and docker-compose.eval.yml gives its api
service an `aevom-api` network alias so those values stay byte-identical there.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: aevom-api
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "aevom-api") | nindent 4 }}
spec:
  selector:
    app: aevom-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8000
{{- end }}
