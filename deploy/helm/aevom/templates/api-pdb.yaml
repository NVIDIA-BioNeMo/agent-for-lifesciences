{{- if and .Values.api.enabled .Values.api.podDisruptionBudget.enabled }}
{{/*
Keeps a node drain from taking the last api pod with it. The selector is
immutable, like the Deployment's, so it stays a bare `app: aevom-api`.

Worth knowing: with minAvailable 1 and the HPA's minReplicas also 1, a drain
blocks until the HPA has scaled up or the eviction times out.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aevom-api
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "aevom-api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: aevom-api
{{- end }}
