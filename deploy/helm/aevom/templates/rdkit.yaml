{{- if .Values.rdkit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdkit
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "rdkit") | nindent 4 }}
spec:
  {{- if not .Values.rdkit.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app: rdkit
  template:
    metadata:
      labels:
        app: rdkit
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rdkit
          image: {{ include "aevom.image" (dict "root" $ "component" "rdkit") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: aevom-config
                  key: LOG_LEVEL
          # No volumes. Depictions are returned inline as bytes and stored as
          # `png` artifacts by the api -- with an HPA in front of this
          # Deployment, a PNG on pod-local disk is unreadable by every other
          # replica.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.rdkit.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rdkit
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "rdkit") | nindent 4 }}
spec:
  selector:
    app: rdkit
  ports:
    - port: 8000
      targetPort: 8000
{{- end }}
