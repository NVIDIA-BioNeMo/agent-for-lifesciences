{{- if .Values.certManager.enabled }}
{{/*
Let's Encrypt issuers for ingress.tls. Two things to know before enabling this:

  - ClusterIssuer is cluster-scoped, so a namespaced release reaches outside its
    namespace here. If two Aevom releases share a cluster, only one may own these.
  - cert-manager must already be installed, or the ClusterIssuer kind does not
    exist and the whole release fails to render.

The staging issuer exists to test the plumbing: Let's Encrypt rate-limits the
production endpoint hard, and a misconfigured HTTP-01 solver burns through the
quota quickly.
*/}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "aevom") | nindent 4 }}
spec:
  acme:
    server: {{ .Values.certManager.server }}
    email: {{ required "certManager.email is required when certManager.enabled is true -- Let's Encrypt rejects a registration without one." .Values.certManager.email }}
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.certManager.ingressClass }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    {{- include "aevom.labels" (dict "root" $ "name" "aevom") | nindent 4 }}
spec:
  acme:
    server: {{ .Values.certManager.stagingServer }}
    email: {{ required "certManager.email is required when certManager.enabled is true -- Let's Encrypt rejects a registration without one." .Values.certManager.email }}
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.certManager.ingressClass }}
{{- end }}
