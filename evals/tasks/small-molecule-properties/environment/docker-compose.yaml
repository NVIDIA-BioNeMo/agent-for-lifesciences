# The Aevom stack for this task.
#
# `include` pulls in the single shared definition at the repo root rather than
# copying it per task, so there is one place where "what production looks like"
# is stated and one place the drift guard has to check. Compose resolves the
# path relative to this file.
#
# Harbor supplies the `main` service itself from [environment].docker_image, so
# it is deliberately absent here.
include:
  - path: ../../../../docker-compose.eval.yml
