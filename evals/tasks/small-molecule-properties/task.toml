schema_version = "1.3"

[task]
name = "aevom/small-molecule-properties"
description = """
Look up a small molecule by name and report its molecular weight. The simplest
end-to-end path through Aevom: a PubChem search chained into a property lookup,
with the answer stated in text.
"""
keywords = ["aevom", "pubchem", "tool-chaining"]

[environment]
# `main` is the harness container, not part of the Aevom stack. It only needs a
# stdlib Python to run the uploaded driver.
docker_image = "python:3.12-slim"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0

# Graded by AevomVerifier (evals/aevom_eval/verifier.py). Only the dimensions
# declared here are scored; see evals/aevom_eval/scoring.py.
[metadata.expect]
# The chained pair is the point of the task: a search that yields a CID, then a
# property lookup keyed by it.
required_tool_sequence = ["search_pubchem", "get_pubchem_properties"]
# Numeric, not substring: "194.2" is a correct rounding of caffeine's molecular
# weight and must pass, while an unrelated "1194.19" must not.
answer_numbers = [{ value = 194.19, tolerance = 0.06 }]
answer_contains = ["caffeine"]
# Not zero, though the happy path needs no retries. PubChem returns 503
# PUGREST.ServerBusy under load, and a baseline run burned five calls to it
# before succeeding. Recovering from that is correct behaviour, not a defect, so
# the budget is calibrated from the baseline with headroom.
max_failed_tool_calls = 6
allow_iteration_limit = false
max_driver_errors = 0
