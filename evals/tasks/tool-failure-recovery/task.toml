schema_version = "1.3"

[task]
name = "aevom/tool-failure-recovery"
description = """
Ask for a compound that does not exist, so the PubChem lookup genuinely fails,
and check that the agent degrades gracefully: it reports the failure instead of
spinning until the iteration limit or inventing a number.

The failure is induced by the query rather than by breaking a service, so the
task is deterministic and does not depend on an upstream outage happening to
coincide with the run.
"""
keywords = ["aevom", "error-handling", "robustness"]

[environment]
docker_image = "python:3.12-slim"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0

[metadata.expect]
required_tools = ["search_pubchem"]
# Not hitting the iteration limit is the point: the failure mode this guards
# against is retrying a doomed lookup until the graph gives up, which burns a
# full budget of tokens and returns nothing useful.
allow_iteration_limit = false
# Several failed lookups are expected and fine -- the compound really is absent.
# The bound just stops an unlimited retry loop from counting as success. A
# baseline gave up after a single search_pubchem and answered.
max_failed_tool_calls = 6
answer_min_chars = 40
# Two checks, because there are two things to establish: that the answer reports
# the miss, and that it does not paper over it with a number.
#
# The first was originally a list of phrasings ("could not", "not found", ...) and
# it was wrong on three consecutive baselines -- "No compounds found in PubChem",
# "does not appear in the PubChem database", "No compound named zzqxtholine was
# found" each slipped past a list tuned on the previous one. Enumerating phrasings
# of a semantic property does not converge. Any honest report of a miss contains a
# negation, so that is what this matches; a fabricated molecular weight does not.
answer_contains_any = [["no ", "not ", "n't", "cannot", "unable"]]
# The second: a molecular weight would be quoted in g/mol, and there is no real
# value to quote. Baselines say "I cannot provide a molecular weight for it"
# without naming a unit. A refusal phrased as "could not find its weight in g/mol"
# would fail this unfairly -- judging fabrication properly wants the LLM judge on
# the live tier, and this is the cheap rule-based stand-in.
answer_excludes = ["g/mol"]
max_driver_errors = 0
